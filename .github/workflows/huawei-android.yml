name: Build experimental Huawei PanVK Android ZIP
on:
  push:
    paths:
      - 'patches/kbase-common/files/src/panfrost/lib/kmod/kbase_kmod.c'
      - 'patches/csf-v11/**'
      - 'scripts/apply-patches.sh'
      - 'scripts/fetch-mesa.sh'
      - 'scripts/apply-huawei-import32.py'
      - 'ci/**'
      - '.github/workflows/huawei-android.yml'
  workflow_dispatch:

concurrency:
  group: zenithblue-harmony42-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: read

jobs:
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Probe published reusable H42 builder image
        id: builder
        continue-on-error: true
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker pull ghcr.io/dissidius/panvk-h42-builder:llvm18-v1
      - name: Restore Ubuntu and Python dependency cache
        if: steps.builder.outcome != 'success'
        id: deps
        uses: actions/cache/restore@v4
        with:
          path: |
            .ci-apt
            .ci-venv
          key: h42-deps-v2-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('ci/h42-apt.txt', 'ci/h42-python.txt') }}
      - name: Restore incremental compiler cache
        uses: actions/cache/restore@v4
        with:
          path: .ci-ccache
          key: h42-ccache-v1-${{ runner.os }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            h42-ccache-v1-${{ runner.os }}-
      - name: Reuse cached tools, install only missing dependencies
        if: steps.builder.outcome != 'success'
        timeout-minutes: 7
        run: bash ci/h42-setup.sh
      - name: Save prepared dependency cache
        if: success() && steps.builder.outcome != 'success' && steps.deps.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            .ci-apt
            .ci-venv
          key: h42-deps-v2-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('ci/h42-apt.txt', 'ci/h42-python.txt') }}
      - name: Restore pinned Mesa source cache
        id: mesa
        uses: actions/cache/restore@v4
        with:
          path: work/mesa
          key: h42-mesa-source-v1-${{ runner.os }}-${{ hashFiles('sources.lock') }}
      - name: Fetch exact Mesa (offline when cached)
        timeout-minutes: 3
        run: ./scripts/fetch-mesa.sh
      - name: Save pinned Mesa source before patching
        if: success() && steps.mesa.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: work/mesa
          key: h42-mesa-source-v1-${{ runner.os }}-${{ hashFiles('sources.lock') }}
      - name: Apply PanVK source patches
        timeout-minutes: 4
        run: ./scripts/apply-patches.sh --profile g615-v11-csf
      - name: Build with published H42 compiler image
        if: steps.builder.outcome == 'success'
        timeout-minutes: 27
        run: |
          bash ci/h42-in-container.sh bash -c 'PANVK_JOBS=4 ./scripts/build-android.sh --profile g615-v11-csf --ndk "$ANDROID_HOME/ndk/29.0.14206865"'
      - name: Build Android arm64 PanVK
        if: steps.builder.outcome != 'success'
        env:
          CC: clang-18
          CXX: clang++-18
          LLVM_CONFIG: llvm-config-18
          ANDROID_NDK_ROOT: ${{ env.ANDROID_HOME }}/ndk/29.0.14206865
          PANVK_JOBS: 4
        run: |
          set -euo pipefail
          ./scripts/build-android.sh --profile g615-v11-csf --ndk "$ANDROID_HOME/ndk/29.0.14206865"
      - name: Report compiler cache hits
        if: always()
        run: command -v ccache >/dev/null 2>&1 && ccache --show-stats || true
      - name: Save incremental compiler cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .ci-ccache
          key: h42-ccache-v1-${{ runner.os }}-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Package experimental driver ZIP
        run: |
          set -euo pipefail
          ROOT="dist/android-g615-v11-csf"
          test -s "$ROOT/libvulkan_panfrost.so"
          cat > "$ROOT/meta.json" <<'EOF'
          {
            "schemaVersion": 1,
            "name": "Zenithblue Universal PanVK Huawei Test (experimental)",
            "author": "dissidius",
            "packageVersion": "0.0.1",
            "driverVersion": "Mesa 26.3.0-devel",
            "minApi": 31,
            "description": "Experimental 32-byte Huawei JM MEM_IMPORT ENOTTY fallback; not device-validated",
            "libraryName": "libvulkan_panfrost.so"
          }
          EOF
          (cd "$ROOT" && zip -q ../PanVK-Huawei-Kirin990-EXPERIMENTAL.zip libvulkan_panfrost.so meta.json)
          sha256sum dist/PanVK-Huawei-Kirin990-EXPERIMENTAL.zip
      - name: Upload experimental driver ZIP
        uses: actions/upload-artifact@v4
        with:
          name: Zenithblue-PanVK-Huawei-Kirin990-EXPERIMENTAL
          path: dist/PanVK-Huawei-Kirin990-EXPERIMENTAL.zip
          if-no-files-found: error
          retention-days: 14
      - name: Upload build logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: Zenithblue-Huawei-build-logs
          path: |
            build/**/meson-logs/
            build/**/*.log
          if-no-files-found: ignore
          retention-days: 7
